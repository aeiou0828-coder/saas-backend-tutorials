        <p><strong>友盟CNZZ 获取ID教程</strong></p>
<p>&nbsp;</p>
<p>1. 访问 https://web.umeng.com，注册并登录账号</p>
<p>2. 进入「工作台」，找到「网站统计 U-Web」卡片，点击「立即使用」</p>
<p><img style="max-width: 100%;" src="7f51fd7fd4b554b9aa2aa3cb.png"></p>
<p><img style="max-width: 100%;" src="db97a5c53ed27a171f6faa46.png"></p>
<p>&nbsp;</p>
<p>3. 点击「添加站点」，填写网站名称、域名、首页 URL、类型和地区，提交</p>
<p><img style="max-width: 100%;" src="bc24c00165bbd20a6c6d04cf.png"></p>
<p>4. 提交后在点击「站点设置&mdash;&mdash;获取代码&mdash;&mdash;统计代码」，文字形式复制代码。复制弹出代码中 id= 后面的数字（即 siteid）</p>
<p><img style="max-width: 100%;" src="317a66a91354befb72706685.png"></p>
