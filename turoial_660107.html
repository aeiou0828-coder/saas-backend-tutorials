        <p>注意：客户端仅简体中文才会展示吃瓜网入口，其余语言下不展示</p>
<p>&nbsp;</p>
<p><strong>一、吃瓜网设置</strong></p>
<p>1、点击修改进入编辑页面，未配置内容的站点均为初始化配置</p>
<p>2、初始状态下都为隐藏，点击展示代表开启吃瓜网客户端展示入口，客户端展示位置有侧边栏、中部导航、底部导航、我的页面</p>
<p>3、入口图标根据提示配置，所有入口均展示此图标</p>
<p><img style="max-width: 100%;" src="87114c91afedf1a3c9cb2ed3.png" width="507" height="293"></p>
<p>&nbsp;</p>
<p><strong>二、文章列表</strong></p>
<p>1、后台有默认分类热门瓜、网红瓜、明星瓜、社会瓜、海外瓜</p>
<p>2、后台会不定期更新数据，每一条数据默认状态为关，点击开启后将在客户端展示</p>
