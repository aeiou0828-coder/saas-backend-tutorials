        <h3><span style="font-size: 24px;">一、头像管理</span></h3>
<p><span style="font-weight: bold;">1.功能说明：</span>会员可在客户端设置个人资料时，从业主提供的头像中选择一个作为个人头像。系统支持停用默认头像，停用后该头像将不再展示于前端页面。</p>
<p><span style="font-weight: bold;">2.界面操作：<br></span><span style="color: #ff0000;"><span style="font-weight: bold;">&nbsp; </span>&nbsp;<span style="color: #000000;">(1)</span><span style="font-weight: bold;"> 头像</span><span style="font-weight: bold;">仅支持&nbsp;</span><span style="font-weight: bold;">PNG 格式</span></span>（适配客户端展示），尺寸为170*170像素<br><span style="font-weight: bold;"><span style="color: #000000;">&nbsp; </span></span><span style="color: #000000;">&nbsp;(2)</span><span style="font-weight: bold;"><span style="color: #000000;">&nbsp;</span></span>若上传的图片不符合尺寸标准，系统会以图片中心为基准，自动裁剪或缩放至符合标准。</p>
